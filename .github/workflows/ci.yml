name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # GitHub's Ubuntu images ship Google Chrome, which the
      # resolver finds on PATH. Installing chromium-browser from
      # apt would be worse than useless: on current Ubuntu it is a
      # snap transitional package that does not run headless here.
      - name: Show the browser being used
        run: bundle exec exe/md2pdf doctor

      # Fails the job if the integration tests skipped, which would
      # mean no browser was found and the suite silently shrank.
      - name: Run tests
        run: |
          bundle exec rake test 2>&1 | tee out.txt
          grep -q '0 skips' out.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the gem
        run: gem build transpareo-md2pdf.gemspec
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: '*.gem'
