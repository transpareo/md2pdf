plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

Layout/LineLength:
  Max: 80
  AllowedPatterns:
    - '^\s*#'
    # A string literal is never split with a backslash
    # continuation, so a line carrying a long one is allowed to run
    # past the margin rather than be broken up.
    - '["''].{30,}["'']'

# Trailing commas keep the diff for adding an entry to one line.
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma

# The project style indents continuation lines by two spaces rather
# than aligning them under the receiver.
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/Documentation:
  Enabled: true

# module_function modules with many small helpers read better than
# an artificial split.
Metrics/ModuleLength:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'Rakefile'
    - '*.gemspec'

# A test class covering one unit is allowed to be long; splitting it
# to satisfy a line count would scatter related cases. The form
# revision builder is one cohesive writer whose methods are already
# small; a split there would only scatter the PDF plumbing.
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/transpareo/md2pdf/form_fields.rb'
    - 'lib/transpareo/md2pdf/field_font.rb'

# A test asserting one rendered document may check many facets of it.
Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'test/**/*'

Minitest/MultipleAssertions:
  Enabled: false
